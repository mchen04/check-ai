name: SDK Publish

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read
  id-token: write

jobs:
  # =============================================================================
  # Build & Verify
  # =============================================================================
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/sdk-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing SDK version: $VERSION"

  # =============================================================================
  # Publish TypeScript SDK to npm
  # =============================================================================
  publish-typescript-sdk:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: verify

    defaults:
      run:
        working-directory: packages/typescript-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # =============================================================================
  # Publish TypeScript LangChain to npm
  # =============================================================================
  publish-typescript-langchain:
    name: Publish TypeScript LangChain
    runs-on: ubuntu-latest
    needs: publish-typescript-sdk

    defaults:
      run:
        working-directory: packages/langchain-ts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      # Wait for npm to propagate the SDK package
      - name: Wait for npm propagation
        run: sleep 30

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # =============================================================================
  # Publish Python SDK to PyPI
  # =============================================================================
  publish-python-sdk:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: verify

    defaults:
      run:
        working-directory: packages/python-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          password: ${{ secrets.PYPI_TOKEN }}

  # =============================================================================
  # Publish Python LangChain to PyPI
  # =============================================================================
  publish-python-langchain:
    name: Publish Python LangChain
    runs-on: ubuntu-latest
    needs: publish-python-sdk

    defaults:
      run:
        working-directory: packages/langchain-python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Wait for PyPI to propagate the SDK package
      - name: Wait for PyPI propagation
        run: sleep 60

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Install SDK from PyPI
        run: pip install check

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/langchain-python/dist/
          password: ${{ secrets.PYPI_TOKEN }}

  # =============================================================================
  # Publish Python LlamaIndex to PyPI
  # =============================================================================
  publish-python-llamaindex:
    name: Publish Python LlamaIndex
    runs-on: ubuntu-latest
    needs: publish-python-sdk

    defaults:
      run:
        working-directory: packages/llamaindex

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Wait for PyPI to propagate the SDK package
      - name: Wait for PyPI propagation
        run: sleep 60

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Install SDK from PyPI
        run: pip install check

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/llamaindex/dist/
          password: ${{ secrets.PYPI_TOKEN }}

  # =============================================================================
  # Summary Job
  # =============================================================================
  publish-summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs:
      - publish-typescript-sdk
      - publish-typescript-langchain
      - publish-python-sdk
      - publish-python-langchain
      - publish-python-llamaindex
    if: always()

    steps:
      - name: Check publish results
        run: |
          echo "=== SDK Publish Summary ==="
          echo "TypeScript SDK: ${{ needs.publish-typescript-sdk.result }}"
          echo "TypeScript LangChain: ${{ needs.publish-typescript-langchain.result }}"
          echo "Python SDK: ${{ needs.publish-python-sdk.result }}"
          echo "Python LangChain: ${{ needs.publish-python-langchain.result }}"
          echo "Python LlamaIndex: ${{ needs.publish-python-llamaindex.result }}"

          if [ "${{ needs.publish-typescript-sdk.result }}" != "success" ] || \
             [ "${{ needs.publish-typescript-langchain.result }}" != "success" ] || \
             [ "${{ needs.publish-python-sdk.result }}" != "success" ] || \
             [ "${{ needs.publish-python-langchain.result }}" != "success" ] || \
             [ "${{ needs.publish-python-llamaindex.result }}" != "success" ]; then
            echo "One or more packages failed to publish"
            exit 1
          fi
          echo "All packages published successfully!"
