name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/sdk-ci.yml'

jobs:
  # =============================================================================
  # TypeScript SDK Tests
  # =============================================================================
  typescript-sdk:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    defaults:
      run:
        working-directory: packages/typescript-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/typescript-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck || echo "No typecheck script"

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

  # =============================================================================
  # TypeScript LangChain Tests
  # =============================================================================
  typescript-langchain:
    name: TypeScript LangChain (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: typescript-sdk
    strategy:
      matrix:
        node-version: [20.x]

    defaults:
      run:
        working-directory: packages/langchain-ts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/langchain-ts/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: packages/typescript-sdk

      - name: Build SDK
        run: npm run build
        working-directory: packages/typescript-sdk

      - name: Install LangChain dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck || echo "No typecheck script"

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

  # =============================================================================
  # Python SDK Tests
  # =============================================================================
  python-sdk:
    name: Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    defaults:
      run:
        working-directory: packages/python-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run type check
        run: mypy shove || echo "Type check skipped"

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: |
          pip install build
          python -m build

  # =============================================================================
  # Python LangChain Tests
  # =============================================================================
  python-langchain:
    name: Python LangChain (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: python-sdk
    strategy:
      matrix:
        python-version: ['3.11']

    defaults:
      run:
        working-directory: packages/langchain-python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install SDK
        run: pip install -e ".[dev]"
        working-directory: packages/python-sdk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run type check
        run: mypy shove_langchain || echo "Type check skipped"

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: |
          pip install build
          python -m build

  # =============================================================================
  # Python LlamaIndex Tests
  # =============================================================================
  python-llamaindex:
    name: Python LlamaIndex (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: python-sdk
    strategy:
      matrix:
        python-version: ['3.11']

    defaults:
      run:
        working-directory: packages/llamaindex

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install SDK
        run: pip install -e ".[dev]"
        working-directory: packages/python-sdk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run type check
        run: mypy shove_llamaindex || echo "Type check skipped"

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: |
          pip install build
          python -m build

  # =============================================================================
  # Summary Job
  # =============================================================================
  sdk-ci-summary:
    name: SDK CI Summary
    runs-on: ubuntu-latest
    needs:
      - typescript-sdk
      - typescript-langchain
      - python-sdk
      - python-langchain
      - python-llamaindex
    if: always()

    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.typescript-sdk.result }}" != "success" ] || \
             [ "${{ needs.typescript-langchain.result }}" != "success" ] || \
             [ "${{ needs.python-sdk.result }}" != "success" ] || \
             [ "${{ needs.python-langchain.result }}" != "success" ] || \
             [ "${{ needs.python-llamaindex.result }}" != "success" ]; then
            echo "One or more SDK tests failed"
            exit 1
          fi
          echo "All SDK tests passed!"
