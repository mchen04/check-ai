[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifyai"
version = "0.1.0"
description = "Official Python SDK for VerifyAI - The Stripe for LLM Verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "VerifyAI", email = "support@verifyai.dev" }
]
keywords = [
    "verifyai",
    "llm",
    "verification",
    "hallucination",
    "ai",
    "sdk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://verifyai.dev"
Documentation = "https://verifyai.dev/docs"
Repository = "https://github.com/verifyai/verifyai-python"

[tool.hatch.build.targets.wheel]
packages = ["verifyai"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
